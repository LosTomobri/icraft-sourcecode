# Aumenta la memoria disponible para Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Propiedades del mod
mod_version = 1.21.1-V0.3.2
maven_group = com.icraft
archives_name = icraft
enabled_platforms = fabric,neoforge

mod_id = icraft
mod_name = iCraft
mod_license = MIT
mod_authors = LosTomobri
mod_description = iCraft adds a fully functional smartphone to Minecraft, with chat, camera, marketplace, notes and more apps to explore.

# Propiedades de Minecraft
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
loader_version_range = [4,)

# Dependencias
architectury_api_version = 13.0.8
fabric_loader_version = 0.19.3
fabric_api_version = 0.116.14+1.21.1
neoforge_version = 21.1.180
neo_version_range = [21.1,)

# Parchment (opcional, si querés nombres de variables legibles al decompilar)
parchment_mappings_version = 2024.11.17
parchment_minecraft_version = 1.21.1
