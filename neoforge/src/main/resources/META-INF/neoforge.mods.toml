modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
logoFile = "icraft_logo.png"

[[mods]]
modId = "icraft"
version = "${version}"
displayName = "iCraft"
authors = "LosTomobri"
description = '''
iCraft adds a fully functional smartphone to Minecraft, with chat, camera, marketplace, notes and more apps to explore.
'''

[[dependencies.icraft]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.icraft]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.icraft]]
modId = "architectury"
type = "required"
versionRange = "[13.0.8,)"
ordering = "AFTER"
side = "BOTH"

# Integración de llamadas privadas (ver com.icraft.voicechat.ICraftVoicechatPluginNeoForge).
# Opcional: si el servidor no tiene Simple Voice Chat, el mod funciona igual y
# el botón de Llamar simplemente avisa que no está disponible.
[[dependencies.icraft]]
modId = "voicechat_api"
type = "optional"
versionRange = "[2.6.20,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "icraft.mixins.json"
